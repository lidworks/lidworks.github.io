  { title: '力是怎么走的', text: '手指的力从屏幕传进它，再传回机身。', view: 'corner', lid: 110, lock: 1, play: 'flow' },
  { title: '想调角度：自动松开', text: '它感觉到你在推屏幕、而手指不在屏幕上，就马上松开。', view: 'corner', lid: 110, play: 'pushRelease' },
  { title: '拆开看', text: '每个零件都拉开一点，点零件看说明。', view: 'corner', lid: 110, explode: 1 },
  { title: '剖开看', text: '沿转轴切开，看看里面。', view: 'inside', lid: 110 },
];
let curStep = -1, playToken = 0;
function buildSteps() {
  const ol = $('#steps'); ol.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="n">${i + 1}</span><span><span class="t"></span><span class="d"></span></span>`;
    b.querySelector('.t').textContent = s.title; b.querySelector('.d').textContent = s.text;

}
const tw = [];   // simple value tweens
function tweenTo(key, to, ms = 900) {
  if (reduceMotion || ms === 0) { state[key] = to; syncInputs(); return; }
  for (let i = tw.length - 1; i >= 0; i--) if (tw[i].key === key) tw.splice(i, 1);
  tw.push({ key, from: state[key], to, t0: performance.now(), ms });
}
const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 200) : ms));
async function runStep(i) {
  const s = STEPS[i], token = ++playToken; curStep = i;

  if (s.view) goView(s.view);

  tweenTo('explode', s.explode ?? 0, 900);

}
async function play(kind, token) {
  const alive = () => token === playToken;
  if (kind === 'tapFree' || kind === 'tapLocked') {
    finger.visible = true;
    for (let n = 0; n < 2 && alive(); n++) {
      fingerGap = 30; tweenFinger(0, 220); await wait(230); if (!alive()) break;
      const done = new Promise(r => startTap(kind === 'tapLocked', r));
      await wait(PH.tap_ms + 40); tweenFinger(30, 300);
      await done; await wait(500);
    }
    finger.visible = false;
  } else if (kind === 'swing') {
    for (const a of [92, 125, 110]) { if (!alive()) return; tweenTo('lid', a, 1300); tweenTo('rotor', a, 1300); await wait(1500); }
  } else if (kind === 'flow') {
    flow.on = true;
  } else if (kind === 'pushRelease') {
    tweenTo('lock', 1, 200); await wait(900); if (!alive()) return;
    pushArrow.visible = true;
    setCaption(DS.pushText || tr('push'));
    await wait(1300); if (!alive()) { pushArrow.visible = false; return; }
    tweenTo('lock', 0, 150); setCaption(DS.releaseText || tr('release'));
    tweenTo('lid', 124, 1400); tweenTo('rotor', 124, 1400); await wait(1500);
    pushArrow.visible = false; await wait(300); if (!alive()) return;

  } else if (kind === 'close') {

}
function setCaption(t) { $('#caption').textContent = t; }
let fingerGap = 30, fingerTw = null;
function tweenFinger(to, ms) { fingerTw = { from: fingerGap, to, t0: performance.now(), ms }; }

// ---------- panel ----------
function showTab(name) {
  for (const t of ['how', 'parts', 'nums']) {
    $('#tab-' + t).setAttribute('aria-selected', t === name); $('#body-' + t).hidden = t !== name;
  }
}
function buildPanel() {
  $('#legend').innerHTML = '';
  const used = new Set(DS.parts.map(p => p.role || 'base'));
  for (const [k, [label, v]] of Object.entries(ROLES)) {
    if (!used.has(k)) continue;

  }
  const ul = $('#parts'); ul.innerHTML = '';

    const grp = p.group || FRAME_GROUP[p.frame] || tr('g_part');

    }
    const li = document.createElement('li'), b = document.createElement('button'); b.dataset.id = p.id;
    b.innerHTML = `<span class="num"></span><span><span class="nm"></span><i class="sw"></i><span class="kid"></span><span class="more"><dl></dl></span></span>`;
    b.querySelector('.num').textContent = p.id; b.querySelector('.nm').textContent = p.name;
    b.querySelector('.sw').style.background = `var(${(ROLES[p.role] || ROLES.base)[1]})`;
    b.querySelector('.kid').textContent = p.kid || '';
    const dl = b.querySelector('dl');

      if (!v) continue; const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd);
    }
    b.addEventListener('click', () => select(selected === p.id ? null : p.id, selected !== p.id));
    li.appendChild(b); ul.appendChild(li);
  }
  const dl = $('#nums'); dl.innerHTML = '';
  for (const n of DS.numbers || []) {
    const row = document.createElement('div'); row.className = 'row';
    const k = document.createElement('dt'), v = document.createElement('dd');
    k.textContent = n.k; v.textContent = n.v; v.className = 'v'; row.append(k, v);
    if (n.note) { const c = document.createElement('dd'); c.className = 'note'; c.textContent = n.note; row.append(c); }
    dl.appendChild(row);
  }
  $('#caveat').textContent = DS.caveat || tr('caveat');
}

// ---------- inputs ----------
function syncInputs() {
  $('#lid').value = Math.round(state.lid); $('#lidO').textContent = Math.round(state.lid) + '°';
  $('#explode').value = Math.round(state.explode * 100); $('#explodeO').textContent = Math.round(state.explode * 100) + '%';
}
$('#lid').addEventListener('input', e => { playToken++; state.lid = +e.target.value; if (state.lock < 0.5) state.rotor = state.lid; syncInputs(); });
$('#explode').addEventListener('input', e => { state.explode = +e.target.value / 100; syncInputs(); });
$$('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('#tShell').addEventListener('click', () => setShell(!state.shell));
$('#tFinish').addEventListener('click', () => setFinish(!state.finish));
$('#tLabels').addEventListener('click', () => setLabels(!state.labels));
for (const t of ['how', 'parts', 'nums']) $('#tab-' + t).addEventListener('click', () => showTab(t));
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables.concat(lapPick), false).filter(h => !state.cut || clipPlane.distanceToPoint(h.point) >= 0);
  const h = hits[0];
  if (h && h.object.userData.part) { showTab('parts'); select(h.object.userData.part, false); }
  else { select(null); if (h && h.object.userData.pick) setCaption(h.object.userData.pick); }
});

// ---------- theme ----------
function applyTheme() {
  scene.background = new THREE.Color(css('--stage'));
  for (const p of parts) p.role.color = roleColor(p.def.role);
  updateCaps();
  if (flow.mat) flow.mat.color = new THREE.Color(css('--lock'));
  highlight(selected);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- build & run ----------
buildLaptop();
DS.parts.forEach(buildPart);
buildLabels(); buildPanel(); buildSteps(); buildFlow(); applyTheme();
setShell(false); setFinish(false); setLabels(true);
state.lid = state.rotor = 110; syncInputs(); applyState();
resize(); { const [t, c] = viewPose(VIEWS.corner); controls.target.copy(t); camera.position.copy(c); }
setClip(false);
function resize() {
  const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}

let last = performance.now();

})().catch(e => { console.error(e); const c = document.getElementById('caption'); if (c) c.textContent = (document.documentElement.lang === 'en' ? 'The model failed to load: ' : '模型没能加载：') + e.message; });
