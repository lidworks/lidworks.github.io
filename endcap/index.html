,330,95],"r":26}},"motion_scale":40,"force_path":[{"frame":"lid","p":[6.4,244.1,14.15]},{"frame":"lid","p":[1.0,245.2,14.2]},{"frame":"lid","p":[-0.75,240.5,10.5]},{"frame":"lid","p":[-2.0,242.3,7.8]},{"frame":"base","p":[-3.15,248.03,5.71]},{"frame":"base","p":[-1.9,248.03,5.71]},{"frame":"base","p":[-3.2,250.0,5.0]},{"frame":"base","p":[-4.9,250.0,5.0]},{"frame":"base","p":[-5.27,248.5,8.0]},{"frame":"base","p":[-5.49,246.5,9.6]},{"frame":"base","p":[-4.9,241.5,8.0]},{"frame":"base","p":[-3.6,236.8,7.0]},{"frame":"base","p":[-2.5,230.5,8.1]},{"frame":"base","p":[-0.13,230.5,8.1]},{"frame":"base","p":[2.0,230.5,8.1]}],"physics":{"I":0.012,"k_hinge":21,"zeta":0.08,"k_locked":285,"zeta_locked":0.1,"tap_N":1.0,"tap_ms":60,"lever_m":0.24,"exaggerate":40},"steps":[{"title":"Normally: fully free","text":"The white ceramic fin sits between the clamp’s two jaws with 5–22 micrometers of space on each side, so nothing touches. The two shape-memory wires are cool, and a small spring holds the cam all the way back. Opening and closing the lid feels just as light as without the endcap.","view":"corner","lid":110,"lock":0,"explode":0,"play":"swing","shell":false},{"title":"Tapping the screen without it","text":"The screen behaves like a board stuck on a soft spring (Apple’s hinge): tap the top edge and it moves back about 2.3 mm, then wobbles back and forth 3–4 times.","view":"whole","lid":110,"lock":0,"explode":0,"play":"tapFree","shell":false},{"title":"A finger touches: the wires warm up and shrink","text":"An app on the Mac sees a finger touch the screen and tells the little chip in the plug, which sends current through two shape-memory wires thinner than a hair. As they warm up they shorten by less than 1 mm and pull the cam plate forward. The cover and the bottom cover are cut away here so you can see inside.","view":"inside","lid":110,"lock":1,"explode":0,"select":"C20","shell":false},{"title":"Cam → springs → lever","text":"The cam’s ramp pushes two rows of ceramic needle rollers apart: the outer row braces against a wall, the inner row bends a pair of small spring blades. The blades push the lever’s hook tip, and the lever turns a tiny bit on two sets of crossed thin spring blades, multiplying the force 4.6 times. The jaw moves in 12 micrometers and clamps the fin.","view":"inside","lid":110,"lock":1,"explode":0,"select":"C15","shell":false},{"title":"Tapping the screen while locked","text":"With the same tap, if the lid is stiff enough, the top edge moves back only about a quarter as far as before (23.5 % when tapping the top-left corner), and the rebound is much smaller. It lets go 1.5 seconds after your finger leaves.","view":"whole","lid":110,"lock":1,"explode":0,"play":"tapLocked","shell":false},{"title":"Where the force goes","text":"Screen corner → corner cradle → fin → two brake pads → caliper → two thin diaphragms → one thin wall → left hook block → a 0.25 mm TPU pad → the laptop’s left side. It’s metal and ceramic all the way; the last pad’s job is “no slipping, no creeping.”","view":"corner","lid":110,"lock":1,"explode":0,"play":"flow","shell":false},{"title":"Two shoes + a belt + heel cups","text":"The small upward force has nothing to push against on the laptop’s rear corners, so it has to be held by friction: a titanium belt runs under the laptop and cinches the left and right shoes tight (700 N), and two heel straps run vertically from behind the rear “ears” down to the underside, where they’re welded to the belt. The heel straps’ pull has to turn around the rear corner, so each rear corner gets a one-piece “heel cup” that wraps around the rounded bottom edge to take it. Everything only presses; nothing is glued to the laptop.","view":"under","lid":110,"lock":1,"explode":0,"shell":true,"select":"B11"},{"title":"Adding the cover: keeps dust out, can’t pinch","text":"A black half-round cover, centered on the hinge axis, sits over the clamp. The fin swings in and out inside it; from outside you only ever touch the cover, which doesn’t move, and the gaps never change width, so fingers and hair can’t get caught. Underneath there’s a bottom cover, and each edge where the fin enters and leaves has a wiper lip that doesn’t touch the fin. Just 5 micrometers of dust caught in the jaws would make the lock too tight, so dust has to stay out. With the lid open, the cover stands 4.4 mm taller than the caliper; with the lid closed, it’s level with the screen.","view":"cover","lid":110,"lock":0,"explode":0,"select":"C30","play":"swing","shell":false},{"title":"Adjusting the angle or losing power: it lets go by itself","text":"When the clamp’s “little scale” feels the screen being pushed steadily for 0.3 seconds, or someone pulling it toward closed, it cuts the power; the wires cool (0.3–0.4 seconds) and a spring pulls the cam back. A power cut or a crash also makes it let go, and no battery is needed. Even while locked, the brake pads slip as soon as the torque goes over 0.4–0.5 N·m, and once the lid is closed below 48° the fin leaves the clamp completely.","view":"whole","lid":110,"lock":1,"explode":0,"play":"pushRelease","shell":false},{"title":"Take it apart","text":"Every part is pulled out a little; click a part to read about it. The rear-corner cradles, cross strap and heel straps are easiest to see with the “Below” view above plus “X-ray” turned on; the covers are in the “Covers” group of the parts list.","view":"explode","lid":110,"lock":0,"explode":1,"shell":false}],"numbers":[{"k":"Whole-chain stiffness (push direction, 45 °C)","v":"264 N·m/rad (low case 186)","note":"v1.2 listed 332; the TPU pads make the anchorage softer. Apple’s hinge is about 21"},{"k":"Left side locked only, tapping the top-left","v":"Deflection down to 23.5 % (GJ 60; low case 26.5 %)","note":"Pass line ≤ 25 %; at GJ 10, 41 % remains. If the lid is too soft, any lock only gets it down to about 40 %"},{"k":"Friction coefficient the anchorage needs","v":"μ ≥ 0.39 (worst-case assembly 0.45)","note":"With a 1.5× margin it must measure ≥ 0.59 (≥ 0.68 to sell). TPU 64D is estimated at 0.45–0.75; bench test 1 decides"},{"k":"When the adhesive works hardest","v":"Closing the lid while locked / lifting by the screen: 71–87 N","note":"Safety factor at 45 °C is 0.6–1.2, not enough → the firmware releases early, and bench test 2 decides (no change only if ≥ 0.85 MPa). All other cases ≥ 2"},{"k":"Will it slowly creep?","v":"TPU 0.25: no","note":"Through hot and cold, the middle ~24 mm stays gripped and resists a 205 N side force (100 needed); PEEK would creep 0.6–3 mm over three years"},{"k":"Rear-corner cradle, thinnest section","v":"Peak shear stress about 455 MPa (S0 110 N)","note":"Left (IN718): margin 1.3–1.65. Right: ≤ 314 MPa, printed titanium ≥ 1.7 (torsion approximation; needs FEA)"},{"k":"Cross strap / heel straps","v":"700 ± 50 N / 100 ± 10 N","note":"The heel straps run vertically and are welded at the cross strap’s bends; the disc springs must stay"},{"k":"Effect of trapped dust","v":"+3.4 N of clamp force per 1 µm of dust","note":"Just 5–13 µm pushes the slip torque to 0.6 N·m → cover + wiper lips + the firmware checks the clamp force (releases if > factory × 1.15)"},{"k":"Slip torque","v":"0.40–0.50 N·m","note":"Below the minimum friction of Apple’s hinge (0.6); set to 0.45 ± 0.02 at the factory"},{"k":"Lock / release","v":"16–27 ms / 0.29–0.43 s","note":"The cover slows wire cooling by only about 2 %; 8 V max, no battery"},{"k":"Size","v":"Sticks out 5.60 at the side and 8.6 mm past the back edge (unchanged)","note":"With the lid open, a 4.4 mm-tall black cover sits on top of the caliper (flush when closed); a small rear-corner cradle sits under each rear corner"},{"k":"Parts and cost","v":"66 parts; prototypes about $366 each (run of 5)","note":"Small batch of 50: about $134 each ($228 for the performance grade); the first unit including tooling is about $1300–1800, and can be split into four steps"}],"caveat":"All stiffness, strength and cost numbers for v1.3 are estimates (grade C). Three go/no-go numbers have to be measured first: the lid’s twisting frequency f2, when the new MacBook Pro can be measured (continue only at ≥ 60 Hz; below 40 Hz the one-sided version is dropped); the friction coefficient of the pads on Apple’s aluminum, on bench test 1 (≥ 0.59); and the adhesive’s strength at 45 °C, on bench test 2 (≥ 0.85 MPa). In the viewer, micrometer-scale motions such as the jaws and hook springs are exaggerated 40×, while the cam and needle rollers are drawn at their true travel (under 1 mm); the safety tether is drawn as it hangs with the lid open at 110°.","lockedText":"Wires warm, cam in place: the fin is clamped and the screen can’t be pushed back","freeText":"Wires cool: the fin turns freely between the jaws and moves with the screen","pushText":"You push the top of the screen: the clamp’s “little scale” feels a steady push, but there’s no finger on the screen…","releaseText":"…so the power cuts out, the wires cool, and 0.3–0.4 s later it lets go. The screen follows your hand.","relockText":"Touch the screen again, the wires warm up, and it quietly clamps again.","parts":[{"id":"L1","level":1,"name":"Side strip","mat":"ti_black","role":"lid","kid":"A long, thin metal strip stuck along the left edge of the screen, like a ruler, that holds the whole gadget firmly in place.","detail":"Ti-6Al-4V, same outline as v1.2. v1.3: the bonded inner face has to follow the screen edge’s cross-section as measured on the new MacBook Pro, “flat + an arc above and below” (contour-matched), so the 0.15 thick tape L4 bonds along its whole length across zc 12.8–15.5 (bonding only the 1.7 mm flat would raise the adhesive stress 1.6×). The model still shows v1.2’s flat face; if the edge’s flat is < 2.2 mm, switch to a 0.25 thick tesa 64825-type tape.","material":"Ti-6Al-4V, bead-blasted + black DLC (bonding face left uncoated)","size":"Length 70.5 (yc 155.5–226.0) × height 3.3 (zc 12.5–15.8); thickness: front 0.8 / middle 1.6 / overlap secti ck","role":"lid","kid":"A heavy, very hard black metal piece that cups the screen’s bottom-left corner like a palm and passes every poke through a pin to the ceramic fin.","detail":"One-piece W-Ni-Cu (90W-6Ni-4Cu, non-magnetic): (1) a tongue that overlaps the outside of L1; (2) a 1.2 thick rotor plate reaching to the hinge axis, with a Ø3.0 H7 hole the fin pin is pressed into; (3) a concentric shell, r 9.03–9.83, wrapping the screen’s R8.7 rounded corner and bearing on it through L3; (4) an end lip that wraps the screen’s bottom end face (≥ 0.3 clearance). The model adds a 1.5 mm transition block at the root of the tongue (in the original design the tongue and rotor plate overlapped by only 0.2 mm of thickness, too weak).","material":"W-Ni-Cu tungsten heavy alloy (ASTM B777 Class 1, μr < 1.05), CNC + wire EDM; bead-blasted + black DLC (L3 bonding face and pin hole left uncoated)","size":"Envelope x −1.75…9.6 × yc 216.0–246.0 × zc 5.3–15.9; rotor plate 1.2 thick; shell 0.8 thick; about 5 g","moves":"Turns with the screen","joins":"Tongue joined to L1 with L5b/L5c; L3 bonded inside the shell’s arc; L7 pressed into the Ø3 hole + 648 retaining compound; the rotor plate’s yc 226–235.5 section stuck with L4 tape","shapes":[{"type":"prism","axis":"x","x0":-1.75,"x1":-1.5,"poly":[[216.0,12.5],[226.0,12.5],[226.0,15.8],[216.0,15.8]],"holes":[[[219.45,14.15],[219.4176,14.3959],[219.3227,14.625],[219.1718,14.8218],[218.975,14.9727],[218.7459,15.0676],[218.5,15.1],[218.2541,15.0676],[218.025,14.9727],[217.8282,14.8218],[217.6773,14.625],[217.5824,14.3959],[217.55,14.15],[217.5824,13.9041],[217.6773,13.675],[217.8282,13.4782],[218.025,13.3273],[218.2541,13.2324],[218.5,13.2],[218.7459,13.2324],[218.975,13.3273],[219.1718,13.4782],[219.3227,13.675],[219.4176,13.9041]],[[224.45,14.15],[224.4176,14.3959],[224.3227,14.625],[224.1718,14.8218],[223.975,14.9727],[223.7459,15.0676],[223.5,15.1],[223.2541,15.0676],[223.025,14.9727],[222.8282,14.8218],[222.6773,14.625],[222.5824,14.3959], pring (about 20 N/mm); the outer top edge is chamfered 0.35 × 0.27 (with the lid open 30–36°, the screen’s bottom edge sweeps past here and would dig in 0.02 without the chamfer). Why one piece: the heel strap’s pull has to turn around the rear corner to reach the shoe, and at that turn the load twists; in v1.2 the metal there was only a few sheets of paper thick (calculated at 830–3950 MPa). Now, at the thinnest section with S0 110 N, the peak shear stress is about 455 MPa and the 99.5th percentile about 363 MPa, giving IN718 a margin of 1.3–1.65 (torsion approximation; needs 3D FEA).","material":"Aged IN718 (GH4169), printed + HIP + finish-machined, exposed faces black DLC","size":"Bottom beam 11 × 5.6 × 4.95; cradle base 7 × about 6.6 × 11.8; back plate 38.1 × 0.5 × 7.5","moves":"Fixed","joins":"Top face (z 4.70) bonded to B1 + 3 × B25; vertical rib bonded to the B1 arm; dovetail joins B2 (B9); B12 spot-welded to the back plate’s inner lower edge; the clamp seat underneath presses B13; C20 runs in the wire channel; B26 on the back plate’s top edge; only presses on the laptop, never sticks (through B5 and the crescent block’s TPU)","explode":[14,2,-12],"anchor":[-1.0,240.0,1.5],"label":[-14,246,-6],"may_touch":["B1","B2","B5","B9","B12","B13","B25","B26","C20","C31","C12","B10"],"shapes":[{"type":"prism","axis":"y","x0":225.5,"x1":228.5,"poly":[[-0.25,-5.6],[4.7,-5.6],[4.7,-0.32],[4.5,-0.32],[3.913,-0.282],[3.335,-0.167],[2.778,0.023],[2.25,0.283],[1.761,0.61],[1.318,0.998],[0.93,1.441],[0.603,1.93],[0.343,2.458],[0.153,3.015],[0.038,3.593],[0.0,4.18],[-0.25,4.18]],"holes":[[[0.6,-4.6],[4.3,-4.6],[4.3,-0.8],[0.6,-0.8]]]},{"type":"prism","axis":"y","x0":228.5,"x1":234.5,"poly":[[-0.25,-5.6],[4.7,-5.6],[4.7,-0.32],[4.5,-0.32],[3.991,-0.291],[3.489,-0.205],[3.0,-0.063],[2.53,0.134],[2.085,0.383],[1.671,0.68],[1.294,1.023],[0.957,1.405],[0.666,1.824],[0.424,2.272],[0.235,2.745],[0.1,3.237],[0.1,0.0],[-0.25,0.0]],"holes":[[[1.7,-3.4],[2.9,-3.4],[2.9,-2.2],[1.7,-2.2]]]} const PH = Object.assign({ I: 0.012, k_hinge: 20, zeta: 0.08, k_locked: 150, zeta_locked: 0.12, tap_N: 1, tap_ms: 60, lever_m: 0.24, exaggerate: 10 }, DS.physics || {});

const tmpV = new THREE.Vector3();

const STEPS = DS.steps && DS.steps.length ? DS.steps : [
